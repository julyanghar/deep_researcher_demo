<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <!-- reflect / next-round feedback loop (drawn first, sits behind) -->
  <path d="M 455 150 C 415 45, 240 45, 200 150" fill="none" stroke="#9333ea"
        stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowP)"/>
  <text x="327" y="40" text-anchor="middle" font-size="14" fill="#9333ea">reflect &#183; launch next round</text>

  <!-- Query -->
  <rect x="10" y="176" width="84" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="52" y="207" text-anchor="middle" font-size="15" fill="#111827">Query</text>
  <line x1="94" y1="202" x2="128" y2="202" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Supervisor -->
  <rect x="130" y="150" width="140" height="104" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="200" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Supervisor</text>
  <text x="200" y="209" text-anchor="middle" font-size="12.5" fill="#1e40af">decompose,</text>
  <text x="200" y="226" text-anchor="middle" font-size="12.5" fill="#1e40af">dispatch, reflect</text>
  <line x1="270" y1="202" x2="352" y2="202" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="311" y="193" text-anchor="middle" font-size="12" fill="#374151">dispatch</text>

  <!-- Researchers (stacked cards to imply N parallel workers) -->
  <rect x="372" y="162" width="190" height="104" rx="10" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.4"/>
  <rect x="366" y="156" width="190" height="104" rx="10" fill="#cdf7d9" stroke="#22c55e" stroke-width="1.4"/>
  <rect x="360" y="150" width="190" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="455" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Researchers (&#215;N)</text>
  <text x="455" y="209" text-anchor="middle" font-size="12.5" fill="#166534">search, read,</text>
  <text x="455" y="226" text-anchor="middle" font-size="12.5" fill="#166534">write summary</text>
  <line x1="564" y1="202" x2="638" y2="202" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="601" y="193" text-anchor="middle" font-size="12" fill="#374151">summaries</text>

  <!-- Writer -->
  <rect x="640" y="150" width="140" height="104" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.8"/>
  <text x="710" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">Writer</text>
  <text x="710" y="209" text-anchor="middle" font-size="12.5" fill="#9a3412">read summaries,</text>
  <text x="710" y="226" text-anchor="middle" font-size="12.5" fill="#9a3412">compose report</text>
  <line x1="780" y1="202" x2="846" y2="202" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Report -->
  <rect x="848" y="176" width="100" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="898" y="207" text-anchor="middle" font-size="15" fill="#111827">Report</text>
</svg>
