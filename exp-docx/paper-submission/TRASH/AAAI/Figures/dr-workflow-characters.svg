<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <!-- reflect / next-round loop -->
  <path d="M 430 78 C 390 20, 220 20, 180 78" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ap)"/>
  <text x="305" y="16" text-anchor="middle" font-size="13" fill="#9333ea">reflect &#183; launch next round</text>

  <!-- Query document -->
  <g transform="translate(20,86)">
    <path d="M0 0 h44 l14 14 v44 h-58 Z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M44 0 v14 h14 Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="9" y1="24" x2="40" y2="24" stroke="#9ca3af" stroke-width="2"/>
    <line x1="9" y1="34" x2="40" y2="34" stroke="#9ca3af" stroke-width="2"/>
    <line x1="9" y1="44" x2="30" y2="44" stroke="#9ca3af" stroke-width="2"/>
  </g>
  <text x="49" y="172" text-anchor="middle" font-size="14" fill="#111827">Query</text>
  <line x1="82" y1="115" x2="118" y2="115" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- SUPERVISOR (blue) with clipboard -->
  <g transform="translate(180,112)">
    <path d="M -24 44 Q -24 12 0 12 Q 24 12 24 44 Z" fill="#3b82f6"/>
    <path d="M -6 30 l6 -14 l6 14 Z" fill="#1e40af"/> <!-- tie -->
    <rect x="-6" y="2" width="12" height="12" fill="#f7d3ab"/>
    <circle cx="0" cy="-9" r="15" fill="#f7d3ab"/>
    <path d="M -15 -11 Q -16 -28 0 -27 Q 16 -28 15 -11 Q 8 -19 0 -19 Q -8 -19 -15 -11 Z" fill="#3b3026"/>
    <circle cx="-5" cy="-9" r="1.7" fill="#333"/><circle cx="5" cy="-9" r="1.7" fill="#333"/>
    <path d="M -4 -3 Q 0 0 4 -3" fill="none" stroke="#333" stroke-width="1.2"/>
    <!-- clipboard prop -->
    <g transform="translate(20,26)">
      <rect x="0" y="0" width="20" height="26" rx="2" fill="#fff" stroke="#1e40af" stroke-width="1.5"/>
      <rect x="6" y="-3" width="8" height="5" rx="1.5" fill="#1e40af"/>
      <line x1="4" y1="8" x2="16" y2="8" stroke="#93c5fd" stroke-width="1.6"/>
      <line x1="4" y1="14" x2="16" y2="14" stroke="#93c5fd" stroke-width="1.6"/>
      <line x1="4" y1="20" x2="12" y2="20" stroke="#93c5fd" stroke-width="1.6"/>
    </g>
  </g>
  <text x="180" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Supervisor</text>
  <text x="180" y="188" text-anchor="middle" font-size="11.5" fill="#1e40af">decompose, dispatch, reflect</text>
  <line x1="240" y1="115" x2="392" y2="115" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="316" y="107" text-anchor="middle" font-size="12" fill="#374151">dispatch</text>

  <!-- RESEARCHER (green) with glasses + magnifier -->
  <g transform="translate(430,112)">
    <path d="M -24 44 Q -24 12 0 12 Q 24 12 24 44 Z" fill="#16a34a"/>
    <path d="M -8 12 L 0 26 L 8 12" fill="none" stroke="#dcfce7" stroke-width="2.5"/> <!-- coat collar -->
    <rect x="-6" y="2" width="12" height="12" fill="#f7d3ab"/>
    <circle cx="0" cy="-9" r="15" fill="#f7d3ab"/>
    <path d="M -15 -11 Q -15 -27 0 -26 Q 15 -27 15 -11 Q 9 -20 0 -20 Q -9 -20 -15 -11 Z" fill="#2b2b2b"/>
    <!-- glasses -->
    <circle cx="-5" cy="-9" r="4" fill="#e0f2fe" stroke="#0f766e" stroke-width="1.4"/>
    <circle cx="5" cy="-9" r="4" fill="#e0f2fe" stroke="#0f766e" stroke-width="1.4"/>
    <line x1="-1" y1="-9" x2="1" y2="-9" stroke="#0f766e" stroke-width="1.4"/>
    <circle cx="-5" cy="-9" r="1.5" fill="#333"/><circle cx="5" cy="-9" r="1.5" fill="#333"/>
    <path d="M -3 -2 Q 0 0.5 3 -2" fill="none" stroke="#333" stroke-width="1.1"/>
    <!-- magnifier prop -->
    <g transform="translate(19,24)">
      <circle cx="6" cy="6" r="8" fill="none" stroke="#166534" stroke-width="2.4"/>
      <line x1="12" y1="12" x2="20" y2="20" stroke="#166534" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <text x="430" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Researchers (&#215;N)</text>
  <text x="430" y="188" text-anchor="middle" font-size="11.5" fill="#166534">search, read, write summary</text>
  <line x1="490" y1="115" x2="642" y2="115" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="566" y="107" text-anchor="middle" font-size="12" fill="#374151">summaries</text>

  <!-- WRITER (orange) with pen + paper -->
  <g transform="translate(690,112)">
    <path d="M -24 44 Q -24 12 0 12 Q 24 12 24 44 Z" fill="#f97316"/>
    <rect x="-6" y="2" width="12" height="12" fill="#f7d3ab"/>
    <circle cx="0" cy="-9" r="15" fill="#f7d3ab"/>
    <path d="M -15 -12 Q -18 -30 0 -27 Q 14 -29 15 -12 Q 12 -16 6 -17 Q -2 -22 -15 -12 Z" fill="#5b3a1e"/>
    <circle cx="-5" cy="-9" r="1.7" fill="#333"/><circle cx="5" cy="-9" r="1.7" fill="#333"/>
    <path d="M -4 -3 Q 0 0 4 -3" fill="none" stroke="#333" stroke-width="1.2"/>
    <!-- paper + pen prop -->
    <g transform="translate(16,22)">
      <rect x="0" y="0" width="20" height="26" rx="2" fill="#fff" stroke="#9a3412" stroke-width="1.5"/>
      <line x1="4" y1="7" x2="16" y2="7" stroke="#fdba74" stroke-width="1.6"/>
      <line x1="4" y1="13" x2="16" y2="13" stroke="#fdba74" stroke-width="1.6"/>
      <line x1="4" y1="19" x2="12" y2="19" stroke="#fdba74" stroke-width="1.6"/>
      <path d="M 14 -6 L 24 4 L 20 8 L 10 -2 Z" fill="#9a3412"/> <!-- pen -->
      <path d="M 10 -2 L 14 -6 L 12 -8 L 8 -4 Z" fill="#fbbf24"/> <!-- pen nib -->
    </g>
  </g>
  <text x="690" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">Writer</text>
  <text x="690" y="188" text-anchor="middle" font-size="11.5" fill="#9a3412">read summaries, compose report</text>
  <line x1="750" y1="115" x2="892" y2="115" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- Report document -->
  <g transform="translate(898,86)">
    <path d="M0 0 h44 l14 14 v44 h-58 Z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M44 0 v14 h14 Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="9" y1="24" x2="40" y2="24" stroke="#9ca3af" stroke-width="2"/>
    <line x1="9" y1="34" x2="40" y2="34" stroke="#9ca3af" stroke-width="2"/>
    <line x1="9" y1="44" x2="30" y2="44" stroke="#9ca3af" stroke-width="2"/>
  </g>
  <text x="927" y="172" text-anchor="middle" font-size="14" fill="#111827">Report</text>
</svg>
